<!DOCTYPE html>
<html>
<head>
    <title>Student Portal - Student Registration</title>
    <link rel="stylesheet" href="Stud_login.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="header-bar">
            <div class="header-brand">
                <a href="index.html" class="brand-link">
                    <img src="Images/Screenshot 2026-07-14 215638.png" alt="Portal Logo" class="brand-logo">
                    <span class="brand-name">Student Portal</span>
                </a>
            </div>
            <nav class="nav-links">
                <a href="about.html">About</a>
                <a href="faqs.html">FAQs</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>

        <main class="main-content">
            <section class="form-card">
                <h1 class="page-title">Student Registration</h1>
                <p class="form-description">Complete the form below to create your student account and access the portal.</p>
                <form>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
                        </div>
                        <div class="form-field">
                            <label for="student_id">Student ID / Roll Number</label>
                            <input type="text" id="student_id" name="student_id" placeholder="e.g. 25dcs080">
                        </div>
                        <div class="form-field">
                            <label for="email">College Email Address</label>
                            <input type="email" id="email" name="email" placeholder="e.g. 25dcs080@charusat.edu.in">
                        </div>
                        <div class="form-field">
                            <label for="department">Department / Course</label>
                            <select id="department" name="department">
                                <option value="" disabled selected>Select your department</option>
                                <option value="CSE">Computer Science</option>
                                <option value="CE">Computer Engineering</option>
                                <option value="IT">Information Technology</option>
                                <option value="AI-ML">AI-ML</option>
                                <option value="CIVIL">Civil</option>
                                <option value="MECH">Mechanical</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter a secure password">
                            <small>Minimum 8 characters</small>
                        </div>
                        <div class="form-field">
                            <label for="confirm_password">Confirm Password</label>
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password">
                        </div>
                    </div>

                    <div class="checkbox-field">
                        <input type="checkbox" id="terms" name="terms">
                        <label for="terms"><i>I agree to the Terms and Conditions</i></label>
                    </div>

                    <button type="submit" class="form-button">Register</button>
                </form>
            </section>
        </main>

        <footer class="footer-bar">
            <p class="footer-note">&copy; 2026 Student Portal System. All Rights Reserved.</p>
        </footer>
    </div>
    <script src="Stud_login.js"></script>
</body>
</html>
