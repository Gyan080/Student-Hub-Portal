<!DOCTYPE html>
<html>
<head>
    <title>Student Portal - Admin Login</title>
    <link rel="stylesheet" href="Admin_login.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="header-bar">
            <div class="header-brand">
                <a href="index.html" class="brand-link">
                    <img src="Images/Screenshot 2026-07-14 215638.png" alt="Portal Logo" class="brand-logo">
                    <span class="brand-name">Student Portal</span>
                </a>
            </div>
            <nav class="nav-links">
                <a href="about.html">About</a>
                <a href="faqs.html">FAQs</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>

        <main class="main-content">
            <section class="form-card">
                <h1 class="page-title">Admin Login</h1>
                <p class="form-description">Fill out this form to log in as an admin and manage portal operations.</p>
                <form>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
                        </div>
                        <div class="form-field">
                            <label for="campus_role">Select Your Campus Role</label>
                            <select id="campus_role" name="campus_role">
                                <option value="" disabled selected>Select your role</option>
                                <option value="faculty">Faculty Member</option>
                                <option value="club_lead">Club Lead / Executive</option>
                                <option value="event_coord">Event Coordinator</option>
                                <option value="admin">Department Administrator</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="email">Official University Email</label>
                            <input type="email" id="email" name="email" placeholder="name@charusat.edu.in">
                        </div>
                        <div class="form-field">
                            <label for="dept">Department</label>
                            <input type="text" id="dept" name="dept" placeholder="e.g., Computer Science">
                        </div>
                        <div class="form-field">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter a secure password">
                        </div>
                        <div class="form-field">
                            <label for="confirm_password">Confirm Password</label>
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password">
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="affiliation_proof">Proof of Affiliation</label>
                        <input type="file" id="affiliation_proof" name="affiliation_proof">
                        <small>Upload ID or proof screenshot</small>
                    </div>

                    <div class="checkbox-field">
                        <input type="checkbox" id="guidelines" name="guidelines">
                        <label for="guidelines"><i>I agree to the Community Guidelines & Code of Conduct</i></label>
                    </div>

                    <button type="submit" class="form-button">Login</button>
                </form>
            </section>
        </main>

        <footer class="footer-bar">
            <p class="footer-note">&copy; 2026 Student Portal System. All Rights Reserved.</p>
        </footer>
    </div>
    <script src="Admin_login.js"></script>
</body>
</html>
