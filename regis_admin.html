    <h1 align="center">Admin Registration</h1>
    <form>
        <table border="1" cellpadding="8" cellspacing="0" width="70%" align="center" bgcolor="#ffffff">
            <tr>
                <th colspan="2" align="center">Admin Details</th>
            </tr>
            <tr>
                <td><label>First Name :</label></td>
                <td><input type="text" name="f_name"></td>
            </tr>
            <tr>
                <td><label>Middle Name :</label></td>
                <td><input type="text" name="m_name"></td>
            </tr>
            <tr>
                <td><label>Last Name :</label></td>
                <td><input type="text" name="l_name"></td>
            </tr>
            <tr>
                <td><label>Admin ID :</label></td>
                <td><input type="text" name="admin_id" maxlength="10" minlength="5"></td>
            </tr>
            <tr>
                <td><label>Date of Birth :</label></td>
                <td><input type="date" name="dob"></td>
            </tr>
            <tr>
                <td><label>Gender :</label></td>
                <td>
                    <input type="radio" name="gender" value="male"> Male
                    <input type="radio" name="gender" value="female"> Female
                    <input type="radio" name="gender" value="other"> Other
                </td>
            </tr>
            <tr>
                <td><label>Email :</label></td>
                <td><input type="email" name="email"></td>
            </tr>
            <tr>
                <td><label>Phone :</label></td>
                <td><input type="tel" name="phone" maxlength="10"></td>
            </tr>
            <tr>
                <td><label>Address :</label></td>
                <td><input type="text" name="address" size="40"></td>
            </tr>
            <tr>
                <td><label>Department :</label></td>
                <td>
                    <select name="department">
                        <option value="CSE">Computer Science</option>
                        <option value="CE">Computer Engineering</option>
                        <option value="IT">IT</option>
                        <option value="AI-ML">AI-ML</option>
                        <option value="CIVIL">Civil</option>
                        <option value="MECH">Mechanical</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label>Admin Role :</label></td>
                <td>
                    <select name="role">
                        <option value="principal">Principal</option>
                        <option value="vice_principal">Vice Principal</option>
                        <option value="coordinator">Coordinator</option>
                        <option value="staff">Staff</option>
                    </select>
                </td>
            </tr>
        </table>
        <div align="center" style="margin-top:10px;">
            <button type="submit">Submit</button>
            <button type="reset">Cancel</button>
        </div>
    </form>
</body>

</html>
