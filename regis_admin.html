<!DOCTYPE html>
<html>
<head>
    <title>Student Portal - Admin Registration</title>
    <link rel="stylesheet" href="regis_admin.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="header-bar">
            <div class="header-brand">
                <a href="index.html" class="brand-link">
                    <img src="c:\Users\gyang\OneDrive\Desktop\wallpaper\Screenshot 2026-07-14 215638.png" alt="Portal Logo" class="brand-logo">
                    <span class="brand-name">Student Portal</span>
                </a>
            </div>
            <nav class="nav-links">
                <a href="about.html">About</a>
                <a href="faqs.html">FAQs</a>
                <a href="contact.html">Contact</a>
                <a href="login.html">Login</a>
            </nav>
        </header>

        <main class="main-content">
            <section class="form-card">
                <h1 class="page-title">Admin Registration</h1>
                <p class="form-description">Enter your admin details to create an official portal account.</p>
                <form>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="firstname">First Name</label>
                            <input type="text" id="firstname" name="f_name" placeholder="First name">
                        </div>
                        <div class="form-field">
                            <label for="middlename">Middle Name</label>
                            <input type="text" id="middlename" name="m_name" placeholder="Middle name">
                        </div>
                        <div class="form-field">
                            <label for="lastname">Last Name</label>
                            <input type="text" id="lastname" name="l_name" placeholder="Last name">
                        </div>
                        <div class="form-field">
                            <label for="admin_id">Admin ID</label>
                            <input type="text" id="admin_id" name="admin_id" placeholder="Enter Admin ID">
                        </div>
                        <div class="form-field">
                            <label for="dob">Date of Birth</label>
                            <input type="date" id="dob" name="dob">
                        </div>
                        <div class="form-field">
                            <label>Gender</label>
                            <div>
                                <input type="radio" id="male" name="gender" value="male">
                                <label for="male">Male</label>
                                <input type="radio" id="female" name="gender" value="female" style="margin-left: 16px;">
                                <label for="female">Female</label>
                                <input type="radio" id="other" name="gender" value="other" style="margin-left: 16px;">
                                <label for="other">Other</label>
                            </div>
                        </div>
                        <div class="form-field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="name@charusat.edu.in">
                        </div>
                        <div class="form-field">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone" maxlength="10" placeholder="10-digit number">
                        </div>
                        <div class="form-field">
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address" placeholder="Your address">
                        </div>
                        <div class="form-field">
                            <label for="department">Department</label>
                            <select id="department" name="department">
                                <option value="CSE">Computer Science</option>
                                <option value="CE">Computer Engineering</option>
                                <option value="IT">IT</option>
                                <option value="AI-ML">AI-ML</option>
                                <option value="CIVIL">Civil</option>
                                <option value="MECH">Mechanical</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="role">Admin Role</label>
                            <select id="role" name="role">
                                <option value="principal">Principal</option>
                                <option value="vice_principal">Vice Principal</option>
                                <option value="coordinator">Coordinator</option>
                                <option value="staff">Staff</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-field">
                        <label for="affiliation_proof">Proof of Affiliation</label>
                        <input type="file" id="affiliation_proof" name="affiliation_proof">
                        <small>Upload ID or proof screenshot</small>
                    </div>
                    <div class="checkbox-field">
                        <input type="checkbox" id="guidelines" name="guidelines">
                        <label for="guidelines"><i>I agree to the Community Guidelines & Code of Conduct</i></label>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="form-button">Submit</button>
                        <button type="reset" class="form-button-secondary">Cancel</button>
                    </div>
                </form>
            </section>
        </main>

        <footer class="footer-bar">
            <p class="footer-note">&copy; 2026 Student Portal System. All Rights Reserved.</p>
        </footer>
    </div>
</body>
</html>
