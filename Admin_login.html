    <main>
<h1 align="center">ADMIN Login</h1>
    <form>
    <table border="1" cellpadding="10" cellspacing="0" width="80%" align="center">
    <tr>
        <td>
            <label><b>Full Name</b></label><br><br>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" size="40">
                    </td>
                    <td>
                        <label><b>Select Your Campus Role</b></label><br><br>
                        <select id="campus_role" name="campus_role">
                            <option value="" disabled selected>Select your role</option>
                            <option value="faculty">Faculty Member</option>
                            <option value="club_lead">Club Lead / Executive</option>
                            <option value="event_coord">Event Coordinator</option>
                            <option value="admin">Department Administrator</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label><b>Official University Email</b></label><br><br>
                        <input type="email" id="email" name="email" placeholder="name@charusat.edu.in" size="40">
                    </td>
                    <td>
                        <label><b>Department</b></label><br><br>
                        <input type="text" id="dept" name="dept" placeholder="e.g., Computer Science" size="40">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label><b>Password</b></label><br><br>
                        <input type="password" id="password" name="password" size="40">
                    </td>
                    <td>
                    <label><b>Confirm Password</b></label><br><br>
                    <input type="password" id="confirm_password" name="confirm_password" size="40">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="affiliation_proof"><b>Proof of Affiliation</b></label><br><br>
                        <input type="file" id="affiliation_proof" name="affiliation_proof">
                        <br><br>
                        <small>Upload ID or proof Screenshot</small>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <br>
                        <input type="checkbox" id="guidelines" name="guidelines">
                        <label for="guidelines"><i>I agree to the Community Guidelines & Code of Conduct</i></label>
                        <br><br>

                        <button type="submit"><b>Login</b></button>
                        <br><br>

                    </td>
                </tr>
            </table>
        </form>
    </main>
    <br>
